<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SkillBridge — Architecture Flow</title>
<style>
  html,body{margin:0;padding:0;background:#e9edf2;}
  #wrap{width:1600px;height:900px;margin:0 auto;background:#fff;}
  svg{display:block;}
  .t{font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
</style>
</head>
<body>
<div id="wrap">
<svg id="diagram" class="t" xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="sh" x="-30%" y="-40%" width="160%" height="190%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#0f172a" flood-opacity="0.20"/>
    </filter>
    <filter id="shSoft" x="-30%" y="-40%" width="160%" height="190%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a5"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <g id="content"></g>
</svg>
</div>

<script>
(function(){
const SVG="http://www.w3.org/2000/svg";
const root=document.getElementById("content");
const NAVY="#12203c", MUTED="#5b6b86", LINE="#0f172a";

/* ---------- text measuring ---------- */
const meas=document.createElementNS(SVG,"text");
meas.setAttribute("x",-9999); meas.setAttribute("y",-9999);
meas.setAttribute("class","t");
document.getElementById("diagram").appendChild(meas);
function w(str,size,weight){
  meas.setAttribute("font-size",size);
  meas.setAttribute("font-weight",weight||700);
  meas.textContent=str;
  return meas.getComputedTextLength();
}
function el(n,a){const e=document.createElementNS(SVG,n);for(const k in a)e.setAttribute(k,a[k]);return e;}
function add(e,p){(p||root).appendChild(e);return e;}
function text(x,y,s,o){
  o=o||{};
  const t=el("text",{x:x,y:y,"font-size":o.size||17,"font-weight":o.weight||700,
    fill:o.fill||NAVY,"text-anchor":o.anchor||"middle","dominant-baseline":"middle",
    "letter-spacing":o.ls||0});
  t.setAttribute("class","t");
  t.textContent=s;
  return add(t,o.parent);
}

/* ---------- inline icon glyphs ---------- */
function icon(kind,cx,cy,c){
  const g=el("g",{});
  const base={fill:"none",stroke:c,"stroke-width":1.9,"stroke-linecap":"round","stroke-linejoin":"round"};
  const S=o=>Object.assign({},base,o||{});
  const p=(n,a)=>g.appendChild(el(n,a));
  switch(kind){
    case "page":
      p("rect",S({x:cx-7,y:cy-9,width:14,height:18,rx:2}));
      p("path",S({d:"M"+(cx-3.5)+" "+(cy-4.5)+"h7 M"+(cx-3.5)+" "+cy+"h7 M"+(cx-3.5)+" "+(cy+4.5)+"h4"}));break;
    case "user":
      p("circle",S({cx:cx,cy:cy-4,r:4}));
      p("path",S({d:"M"+(cx-7.5)+" "+(cy+8.5)+"a7.5 7 0 0 1 15 0"}));break;
    case "users":
      p("circle",S({cx:cx-3,cy:cy-4,r:3.6}));
      p("path",S({d:"M"+(cx-9.5)+" "+(cy+8)+"a6.5 6 0 0 1 13 0"}));
      p("path",S({d:"M"+(cx+4)+" "+(cy-6.6)+"a3.4 3.4 0 0 1 0 5.4 M"+(cx+3.5)+" "+(cy+1.5)+"a6 5.5 0 0 1 6 6.5"}));break;
    case "lock":
      p("rect",S({x:cx-7,y:cy-2,width:14,height:11,rx:2}));
      p("path",S({d:"M"+(cx-4)+" "+(cy-2)+"v-3.6a4 4 0 0 1 8 0v3.6"}));break;
    case "key":
      p("circle",S({cx:cx-4,cy:cy-2.5,r:4.2}));
      p("path",S({d:"M"+(cx-1.2)+" "+(cy+0.6)+"l7 7 M"+(cx+2.8)+" "+(cy+4.6)+"l2.6-2.6"}));break;
    case "grid":
      p("rect",S({x:cx-8,y:cy-8,width:7,height:7,rx:1.4}));
      p("rect",S({x:cx+1,y:cy-8,width:7,height:7,rx:1.4}));
      p("rect",S({x:cx-8,y:cy+1,width:7,height:7,rx:1.4}));
      p("rect",S({x:cx+1,y:cy+1,width:7,height:7,rx:1.4}));break;
    case "gap":
      p("path",S({d:"M"+(cx-8)+" "+(cy+7)+"v-5 M"+(cx-2.7)+" "+(cy+7)+"v-10 M"+(cx+2.7)+" "+(cy+7)+"v-6.5 M"+(cx+8)+" "+(cy+7)+"v-13"}));break;
    case "badge":
      p("circle",S({cx:cx,cy:cy-3.5,r:5.4}));
      p("path",S({d:"M"+(cx-3.6)+" "+(cy+1.2)+"L"+(cx-5)+" "+(cy+9)+"l5-2.6 5 2.6-1.4-7.8"}));break;
    case "spark":
      p("path",S({d:"M"+(cx-1.5)+" "+(cy-9)+"l1.8 4.6 4.6 1.8-4.6 1.8-1.8 4.6-1.8-4.6-4.6-1.8 4.6-1.8z"}));
      p("path",S({d:"M"+(cx+5.5)+" "+(cy+3.2)+"l.9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9z"}));break;
    case "send":
      p("path",S({d:"M"+(cx-8.5)+" "+(cy+7.5)+"L"+(cx+8.5)+" "+(cy-7.5)}));
      p("path",S({d:"M"+(cx+8.5)+" "+(cy-7.5)+"l-5.4 15.5-3.6-6.6-6.6-3.6z"}));break;
    case "track":
      p("circle",S({cx:cx,cy:cy,r:8.2}));
      p("path",S({d:"M"+cx+" "+(cy-4.6)+"V"+cy+"l3.4 2.6"}));break;
    case "bldg":
      p("rect",S({x:cx-8.5,y:cy-9,width:10,height:18,rx:1.5}));
      p("path",S({d:"M"+(cx+1.5)+" "+(cy-2)+"h7v11h-7"}));
      p("path",S({d:"M"+(cx-5.8)+" "+(cy-5.6)+"h1.6 M"+(cx-5.8)+" "+(cy-1.4)+"h1.6 M"+(cx-5.8)+" "+(cy+2.8)+"h1.6"}));break;
    case "post":
      p("rect",S({x:cx-8,y:cy-8,width:16,height:16,rx:2.6}));
      p("path",S({d:"M"+cx+" "+(cy-4)+"v8 M"+(cx-4)+" "+cy+"h8"}));break;
    case "eye":
      p("path",S({d:"M"+(cx-9.2)+" "+cy+"s3.7-5.7 9.2-5.7 9.2 5.7 9.2 5.7-3.7 5.7-9.2 5.7S"+(cx-9.2)+" "+cy+" "+(cx-9.2)+" "+cy+"z"}));
      p("circle",S({cx:cx,cy:cy,r:2.5}));break;
    case "kanban":
      p("rect",S({x:cx-8.5,y:cy-8,width:5,height:16,rx:1.3}));
      p("rect",S({x:cx-2.5,y:cy-8,width:5,height:11,rx:1.3}));
      p("rect",S({x:cx+3.5,y:cy-8,width:5,height:13.5,rx:1.3}));break;
    case "steps":
      p("path",S({d:"M"+(cx-8.5)+" "+(cy+7)+"h5.5v-5.5h5.5v-5.5h5.5"}));break;
    case "cap":
      p("path",S({d:"M"+cx+" "+(cy-8)+"l9.2 4.3-9.2 4.3-9.2-4.3z"}));
      p("path",S({d:"M"+(cx-5)+" "+(cy-1.5)+"v4.8c0 1.8 2.3 3 5 3s5-1.2 5-3v-4.8"}));break;
    case "chart":
      p("path",S({d:"M"+(cx-8)+" "+(cy-8.5)+"v17h17"}));
      p("path",S({d:"M"+(cx-3.6)+" "+(cy+4.6)+"v-5 M"+(cx+1)+" "+(cy+4.6)+"v-9.4 M"+(cx+5.6)+" "+(cy+4.6)+"v-6.6"}));break;
    case "gauge":
      p("path",S({d:"M"+(cx-8.6)+" "+(cy+5)+"a8.6 8.6 0 0 1 17.2 0"}));
      p("path",S({d:"M"+cx+" "+(cy+5)+"l5.2-5.8"}));break;
    case "scale":
      p("path",S({d:"M"+(cx-8.5)+" "+(cy+7)+"L"+(cx-1)+" "+(cy-5.5)+" M"+(cx+8.5)+" "+(cy+7)+"L"+(cx+1.5)+" "+(cy-1.5)}));
      p("circle",S({cx:cx-0.6,cy:cy-7.4,r:1.8}));break;
    case "arrowout":
      p("path",S({d:"M"+(cx-2)+" "+(cy-7)+"h-6.5v14.5h14.5v-6.5"}));
      p("path",S({d:"M"+(cx-1)+" "+(cy+1)+"L"+(cx+8.5)+" "+(cy-8.5)+" M"+(cx+2)+" "+(cy-8.5)+"h6.5v6.5"}));break;
    case "hour":
      p("path",S({d:"M"+(cx-6)+" "+(cy-8.5)+"h12 M"+(cx-6)+" "+(cy+8.5)+"h12"}));
      p("path",S({d:"M"+(cx-5)+" "+(cy-8.5)+"c0 6 10 4.5 10 17 M"+(cx+5)+" "+(cy-8.5)+"c0 6-10 4.5-10 17"}));break;
    case "match":
      p("path",S({d:"M"+(cx-9)+" "+(cy-4.6)+"h5.5 M"+(cx+3.5)+" "+(cy-4.6)+"h5.5 M"+(cx-9)+" "+(cy+4.6)+"h5.5 M"+(cx+3.5)+" "+(cy+4.6)+"h5.5"}));
      p("circle",S({cx:cx,cy:cy-4.6,r:2.5}));
      p("circle",S({cx:cx,cy:cy+4.6,r:2.5}));break;
    case "shield":
      p("path",S({d:"M"+cx+" "+(cy-9)+"l7.2 3v5.7c0 4.6-3.3 7.7-7.2 8.8-3.9-1.1-7.2-4.2-7.2-8.8v-5.7z"}));
      p("path",S({d:"M"+(cx-3.2)+" "+(cy+0.4)+"l2.3 2.5 4.4-4.9"}));break;
    case "flag":
      p("path",S({d:"M"+(cx-5.5)+" "+(cy+9)+"V"+(cy-9)}));
      p("path",S({d:"M"+(cx-5.5)+" "+(cy-8)+"h11.5l-2.6 4.2 2.6 4.2h-11.5"}));break;
    case "check":
      p("circle",S({cx:cx,cy:cy,r:8.6}));
      p("path",S({d:"M"+(cx-4.2)+" "+(cy+0.3)+"l3.2 3.4 5.4-6.2"}));break;
  }
  return g;
}

/* ---------- shapes ---------- */
function measureBox(s){
  const pad=s.pad||15, iw=s.icon?27:0;
  const tw=w(s.title,s.titleSize||18.5,700);
  const sw=s.sub?w(s.sub,s.subSize||12.8,500):0;
  return Math.max(s.min||0, pad*2+iw+Math.max(tw,sw));
}
function box(o){
  const TS=o.titleSize||18.5, SS=o.subSize||12.8, pad=o.pad||15;
  const iconW=o.icon?27:0;
  const W=o.w||measureBox(o);
  const H=o.h||(o.sub?62:50);
  const x=o.cx-W/2, y=o.cy-H/2;
  const g=add(el("g",{}));
  g.appendChild(el("rect",{x:x,y:y,width:W,height:H,rx:(o.rx===undefined?11:o.rx),
     fill:o.fill||"#ffffff",stroke:o.stroke||"#c9d3e2","stroke-width":o.sw||1.4,
     filter:"url(#"+(o.shadow||"sh")+")"}));
  const cl=x+pad, cr=x+W-pad;
  const tx=(cl+iconW+cr)/2;
  if(o.icon) g.appendChild(icon(o.icon,cl+11.5,o.cy,o.iconColor||o.titleColor||"#3d5a86"));
  if(o.sub){
    text(tx,o.cy-11,o.title,{size:TS,weight:700,fill:o.titleColor||NAVY,parent:g});
    text(tx,o.cy+12,o.sub,{size:SS,weight:500,fill:o.subColor||MUTED,parent:g});
  }else{
    text(tx,o.cy+0.5,o.title,{size:TS,weight:700,fill:o.titleColor||NAVY,parent:g});
  }
  return {w:W,h:H,cx:o.cx,cy:o.cy,l:x,r:x+W,t:y,b:y+H};
}
function pill(o){
  o.rx=(o.h||(o.sub?62:50))/2;
  o.pad=o.pad||22;
  o.fill=o.fill||"#bdf0ce"; o.stroke=o.stroke||"#4faf74";
  o.titleColor="#0c3d23"; o.subColor="#2e6b47"; o.iconColor="#1a6b40";
  return box(o);
}
function diamond(o){
  const TS=o.titleSize||16.5;
  const W=o.w||Math.max(0,w(o.title,TS,700)+66), H=o.h||76;
  const cx=o.cx, cy=o.cy;
  const g=add(el("g",{}));
  g.appendChild(el("path",{d:"M"+cx+" "+(cy-H/2)+"L"+(cx+W/2)+" "+cy+"L"+cx+" "+(cy+H/2)+"L"+(cx-W/2)+" "+cy+"Z",
    fill:"#ffe1d4",stroke:"#e2703a","stroke-width":1.8,filter:"url(#sh)"}));
  text(cx,cy+0.5,o.title,{size:TS,weight:700,fill:"#8a3410",parent:g});
  return {w:W,h:H,cx:cx,cy:cy,l:cx-W/2,r:cx+W/2,t:cy-H/2,b:cy+H/2};
}
function band(o){
  const g=add(el("g",{}));
  g.appendChild(el("rect",{x:o.x,y:o.y,width:o.w,height:o.h,rx:14,fill:o.fill,
    stroke:o.stroke,"stroke-width":1.6,"stroke-dasharray":o.dash||"none"}));
  if(o.label){
    text(o.x+18,o.y+18,o.label,{size:13.5,weight:800,fill:o.labelColor,anchor:"start",parent:g,ls:1.2});
    if(o.sublabel){
      const lw=w(o.label,13.5,800)+o.label.length*1.2;
      text(o.x+18+lw+13,o.y+18.5,o.sublabel,{size:11.8,weight:500,fill:o.labelColor,anchor:"start",parent:g});
    }
  }
  return g;
}
function arrow(a,b,y,dashed){
  const yy=(y===undefined?a.cy:y);
  add(el("line",{x1:a.r+4,y1:yy,x2:b.l-5,y2:yy,
    stroke:dashed?"#8b93a5":LINE,"stroke-width":1.9,
    "stroke-dasharray":dashed?"5 4":"none",
    "marker-end":"url(#"+(dashed?"arwG":"arw")+")","stroke-linecap":"round"}));
}
function sequence(specs,x0,x1,cy){
  const ws=specs.map(s=>{
    if(s.w) return s.w;
    if(s.type==="diamond") return Math.max(0,w(s.title,s.titleSize||16.5,700)+66);
    if(s.type==="pill") return measureBox(Object.assign({},s,{pad:s.pad||22}));
    return measureBox(s);
  });
  const total=ws.reduce((a,b)=>a+b,0);
  const gap=((x1-x0)-total)/(specs.length-1);
  let cur=x0;
  const nodes=specs.map((s,i)=>{
    const o=Object.assign({},s,{cx:cur+ws[i]/2,cy:cy,w:ws[i]});
    cur+=ws[i]+gap;
    if(s.type==="diamond") return diamond(o);
    if(s.type==="pill") return pill(o);
    return box(o);
  });
  for(let i=0;i<nodes.length-1;i++) arrow(nodes[i],nodes[i+1],cy,specs[i+1].dashArrow);
  return nodes;
}

/* =====================  LAYOUT  ===================== */
const L=26, R=1574;

/* ---- TOP ROW ---- */
band({x:L,y:14,w:R-L,h:98,fill:"#eef4fb",stroke:"#cfe0f2"});
sequence([
  {type:"pill",title:"Start Here",icon:"flag",titleSize:18},
  {title:"Visit Landing Page",icon:"page",titleSize:17.5},
  {type:"diamond",title:"New or Existing?"},
  {title:"Sign Up",sub:"OR   Login",icon:"user"},
  {title:"Role Selection",sub:"Student / Industry / Academician",icon:"users",titleSize:17.5,subSize:12.4},
  {type:"diamond",title:"Auth Method?"},
  {title:"Email + Password (bcrypt + JWT)",sub:"OR   Google OAuth (Supabase)",icon:"lock",titleSize:16.2,subSize:12.4},
  {type:"pill",title:"Role-Based Redirect",sub:"JWT Session",icon:"key",titleSize:16.4}
], L+14, R-14, 63);

/* ---- STUDENT ---- */
band({x:L,y:128,w:R-L,h:128,fill:"#e8f2fd",stroke:"#a9cdee",label:"STUDENT FLOW",labelColor:"#1d5c9e"});
sequence([
  {title:"Dashboard",icon:"grid",titleSize:18.5},
  {title:"Skill Gap Report",sub:"auto-updated",icon:"gap"},
  {title:"Proof-of-Skill Challenge",sub:"upload + verify",icon:"badge",titleSize:17.2},
  {title:"AI Match Score",sub:"+ “Why This Match”",icon:"spark"},
  {title:"Apply to Opportunity",sub:"one-click apply",icon:"send",titleSize:17.5},
  {title:"Track Status",sub:"+ AI Career Advisor",icon:"track"},
  {type:"pill",title:"Application Tracked ✓",icon:"check",titleSize:17.2}
], L+16, R-16, 204);

/* ---- INDUSTRY ---- */
band({x:L,y:272,w:R-L,h:128,fill:"#fdefe4",stroke:"#f0c39a",label:"INDUSTRY FLOW",labelColor:"#a1541c"});
sequence([
  {title:"Company Profile Setup",icon:"bldg",titleSize:17.2},
  {title:"Post Opportunity",sub:"+ define required skills",icon:"post",titleSize:17.5},
  {title:"View Candidates",sub:"+ Match Score",icon:"eye"},
  {title:"Applicant Pipeline",sub:"Kanban board",icon:"kanban"},
  {title:"Move Through Stages",sub:"shortlist → offer",icon:"steps",titleSize:17.2},
  {title:"Post Skill Program",sub:"training tracks",icon:"cap",titleSize:17.5},
  {type:"pill",title:"Candidate Selected ✓",icon:"check",titleSize:17.2}
], L+16, R-16, 348);

/* ---- ROW 4: ADMIN | ACADEMICIAN ---- */
const SPLIT=1074;
band({x:L,y:416,w:SPLIT-L,h:128,fill:"#f0ecfb",stroke:"#b9a8e6",dash:"7 5",
      label:"ADMIN FLOW",labelColor:"#5b3fa8"});
sequence([
  {title:"Institution Analytics",icon:"chart",titleSize:17.2},
  {title:"Avg. Skill Readiness",sub:"cohort benchmark",icon:"gauge",titleSize:17},
  {title:"Demand vs Supply Chart",sub:"live skill market",icon:"scale",titleSize:16.8},
  {title:"Read-Only",sub:"Not Yet Live",icon:"hour",dashArrow:true,
   fill:"#f8f5ff",stroke:"#c3b4ea",titleColor:"#6a5a99",subColor:"#8b7cb8",
   iconColor:"#8b7cb8",shadow:"shSoft"}
], L+16, SPLIT-16, 492);

band({x:SPLIT+16,y:416,w:R-(SPLIT+16),h:128,fill:"#f1f3f6",stroke:"#c2c8d2",dash:"7 5",
      label:"ACADEMICIAN FLOW",labelColor:"#5b6472"});
sequence([
  {title:"Login",sub:"role: academician",icon:"key",titleSize:18},
  {title:"Redirect to Portal",sub:"external LMS",icon:"arrowout",titleSize:16.6},
  {title:"Coming Soon",sub:"Stub Only",icon:"hour",dashArrow:true,
   fill:"#f9fafc",stroke:"#ccd2dc",titleColor:"#6b7484",subColor:"#8b93a1",
   iconColor:"#8b93a1",shadow:"shSoft",titleSize:16.6}
], SPLIT+32, R-16, 492);

/* ---- COMMON SYSTEMS ---- */
band({x:L,y:560,w:R-L,h:122,fill:"#fdf6dd",stroke:"#e8ce7a",
      label:"COMMON SYSTEMS",labelColor:"#8a6a12",sublabel:"shared by every role"});
(function(){
  const specs=[
    {title:"Matching Engine",sub:"Weighted Scoring",icon:"match"},
    {title:"AI Career Advisor",sub:"OpenRouter LLM",icon:"spark"},
    {title:"Skill Trust Verification",sub:"proof + peer review",icon:"shield"},
    {title:"JWT + Supabase Auth",sub:"session + row-level security",icon:"lock"}
  ];
  const x0=L+18, x1=R-18, n=specs.length, gap=26;
  const W=((x1-x0)-gap*(n-1))/n;
  specs.forEach((s,i)=>{
    box(Object.assign({},s,{cx:x0+i*(W+gap)+W/2,cy:630,w:W,h:66,
      fill:"#ffffff",stroke:"#e2cd8e",iconColor:"#a17d12",titleSize:19.5,subSize:13.2}));
  });
})();

/* ---- TECH STACK ---- */
(function(){
  const y=790;
  add(el("rect",{x:L,y:y-48,width:R-L,height:96,rx:14,fill:"#f7f9fc",stroke:"#e2e8f0","stroke-width":1.4}));
  text(L+18,y-32,"TECH STACK",{size:13.5,weight:800,fill:"#64748b",anchor:"start",ls:1.2});
  const stack=[
    {n:"React",c:"#3aa8cf"},{n:"Vite",c:"#8b5cf6"},{n:"Tailwind CSS",c:"#2596c9"},
    {n:"Node.js",c:"#4f8a3f"},{n:"Express",c:"#3b4252"},{n:"Supabase (Postgres)",c:"#22a06f"},
    {n:"OpenRouter",c:"#4b5563"},{n:"Vercel",c:"#111827"},{n:"Render",c:"#0e9c86"}
  ];
  const sizes=stack.map(s=>w(s.n,15.5,600)+40);
  const total=sizes.reduce((a,b)=>a+b,0);
  const gap=((R-L-56)-total)/(stack.length-1);
  let cur=L+28;
  stack.forEach((s,i)=>{
    const gx=cur+13;
    add(stackIcon(s.n,gx,y+4,s.c));
    text(gx+17,y+4.5,s.n,{size:15.5,weight:600,fill:"#33405a",anchor:"start"});
    cur+=sizes[i]+gap;
  });
  function stackIcon(name,cx,cy,c){
    const g=el("g",{});
    const S=o=>Object.assign({fill:"none",stroke:c,"stroke-width":1.9,"stroke-linecap":"round","stroke-linejoin":"round"},o||{});
    const p=(n,a)=>g.appendChild(el(n,a));
    if(name==="React"){
